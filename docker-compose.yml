name: ai-job-copilot

x-app: &app
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://copilot:${POSTGRES_PASSWORD:-copilot}@postgres:5432/copilot
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-copilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-copilot-secret}
    volumes:
      - miniodata:/data
    profiles: ["s3"]
    restart: unless-stopped

  migrate:
    build:
      context: .
    env_file:
    - path: .env
      required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://copilot:${POSTGRES_PASSWORD:-copilot}@postgres:5432/copilot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "app.main", "bot"]
    volumes:
      - storage:/app/var

  api:
    <<: *app
    command: ["python", "-m", "app.main", "api"]
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/var

volumes:
  pgdata:
  redisdata:
  miniodata:
  storage:
